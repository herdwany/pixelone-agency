<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030303">
    <title>دخول العملاء - Pixel One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- استدعاء بيئة العمل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="view-centered">

    <div class="w-full max-w-md animate-fade-up">
        <!-- الشعار في الأعلى -->
        <a href="index.html" class="text-center mb-10 logo-container" style="display: flex; flex-direction: column; gap: 10px;">
            <span class="logo-p" style="font-size: 2.5rem; padding: 5px 20px;">P</span>
            <h2 class="text-white font-black tracking-widest uppercase text-2xl font-en">Pixel One</h2>
        </a>

        <!-- كرت المصادقة -->
        <div class="water-card p-10 rounded-3xl">
            <h3 id="formTitle" class="text-3xl font-black mb-2 text-center text-white">تسجيل الدخول</h3>
            <p id="formSubTitle" class="text-gray-500 text-center text-sm mb-8">إدارة مشاريعك وطلباتك بكل سهولة</p>

            <!-- صندوق الإشعارات -->
            <div id="msgBox" class="msg-box" aria-live="polite"></div>

            <form id="authForm" class="space-y-6">
                <div>
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="client@domain.com" class="input-luxury font-en text-left" dir="ltr">
                </div>
                
                <div>
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" class="input-luxury font-en text-left" dir="ltr">
                </div>

                <button type="submit" id="btnSubmit" class="btn-filled-red w-full py-4 rounded-xl text-lg mt-6 font-black">
                    دخول المنصة
                </button>
            </form>

            <div class="mt-8 text-center pt-6 border-t border-white/5">
                <p id="toggleText" class="text-gray-500 text-sm inline">ليس لديك حساب؟</p>
                <button type="button" id="toggleBtn" class="btn-transparent-link text-sm mx-2">إنشاء حساب جديد</button>
            </div>
        </div>
        
        <div class="text-center mt-8">
            <a href="index.html" class="text-gray-600 hover:text-white transition text-xs font-bold no-underline">← العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت -->
    <script src="app.js"></script>
</body>
</html>
