<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelOne V2 - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans"
    style="display: none;"> <!-- إخفاء المحتوى حتى يتم التحقق من المستخدم -->

    <nav class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500">PixelOne Dashboard</h1>
        <button id="logoutBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded text-sm transition">تسجيل الخروج</button>
    </nav>

    <main class="p-8">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold mb-4">أهلاً بك، <span id="userEmail" class="text-blue-400">...</span></h2>
            <p class="text-gray-400">هذه هي بداية مشروعك الجديد. من هنا سنبدأ بإدارة الوكالة الخاصة بك.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
                <div class="p-6 bg-gray-800 rounded-lg border border-gray-700">
                    <h3 class="text-lg font-semibold mb-2">المشاريع</h3>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <div class="p-6 bg-gray-800 rounded-lg border border-gray-700">
                    <h3 class="text-lg font-semibold mb-2">الطلبات</h3>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <div class="p-6 bg-gray-800 rounded-lg border border-gray-700">
                    <h3 class="text-lg font-semibold mb-2">الرصيد</h3>
                    <p class="text-2xl font-bold">$0</p>
                </div>
            </div>
        </div>
    </main>

<script>
    // تهيئة Supabase بنفس بياناتك السابقة
    const SUPABASE_URL = 'https://grdjidvagrxavuwykqjf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_09I_ZPReuprW9qZRqlG0nA_vxCBY6WS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 🛡️ دالة حماية المسار (تشتغل فوراً عند تحميل الصفحة)
    async function protectRoute() {
        // التحقق من وجود مستخدم مسجل دخول
        const { data: { user }, error } = await _supabase.auth.getUser();

        if (error || !user) {
            // إذا لم يوجد مستخدم أو حدث خطأ، يتم تحويله لصفحة الدخول
            console.log("غير مصرح بالدخول، جاري التحويل...");
            window.location.href = "index.html";
        } else {
            // إذا كان المستخدم موجوداً، نعرض بريده الإلكتروني في اللوحة
            document.getElementById('userEmail').textContent = user.email;
            // إظهار محتوى الصفحة (اختياري إذا كنت تخفي المحتوى بالـ CSS)
            document.body.style.display = "block";
        }
    }

    // تشغيل الحماية
    protectRoute();

    // زر تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        const { error } = await _supabase.auth.signOut();
        if (!error) {
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
