    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body id="view-service-detail" data-service-id="svc-professional-design"
    class="selection:bg-red-600 selection:text-white site-shell">
    <main id="mainContent" class="max-w-7xl mx-auto px-6 py-16 relative z-10">
        <section id="serviceDetailRoot" class="animate-fade-up">
            <div class="water-card rounded-3xl p-8 text-center text-gray-400">جاري تحميل تفاصيل الخدمة...</div>
        </section>
    </main>
    <div id="orderModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true"
        aria-labelledby="orderModalTitle"><button type="button" class="modal-close-btn"
            data-action="close-order-modal">✕</button>
        <div class="modal-content water-card p-8 md:p-10 rounded-[2rem] relative border border-white/10">
            <h3 id="orderModalTitle" class="text-2xl font-black mb-1 text-center text-white">إتمام طلب الخدمة</h3>
            <p id="orderServiceInfo" class="text-center mb-6 text-base font-bold text-brand-red"><span
                    id="selectedServiceText">...</span><span id="orderPriceTag"
                    class="text-gray-400 font-normal mr-2"></span></p>
            <div id="orderMsgBox" class="msg-box hidden" aria-live="polite"></div>
            <form id="orderForm" class="space-y-5"><input type="hidden" id="hiddenServiceName" name="serviceName"><input
                    type="hidden" id="hiddenFinalPrice" name="finalPrice"><input type="hidden" id="hiddenDiscountCode"
                    name="discountCode">
                <div><label for="orderName" class="form-label">الاسم الكامل</label><input type="text" id="orderName"
                        name="name" required autocomplete="name" placeholder="اكتب اسمك هنا..."
                        class="input-luxury focus:ring-2 focus:ring-brand-red/50"></div>
                <div><label for="orderPhone" class="form-label">رقم الواتساب</label><input type="tel" id="orderPhone"
                        name="phone" required autocomplete="tel" placeholder="مثال: 06XXXXXXXX"
                        class="input-luxury number-font text-right focus:ring-2 focus:ring-brand-red/50" dir="ltr">
                    <p id="orderPhoneHint" class="text-xs text-emerald-400 mt-1 hidden">✓ تم ملء رقمك تلقائياً — تأكد
                        أنه صحيح.</p>
                </div>
                <div><label for="orderProjectName" class="form-label">اسم مشروعك أو رابط صفحتك</label><input type="text"
                        id="orderProjectName" name="projectName" required
                        placeholder="مثال: مطعم الأمل، أو رابط حساب إنستغرام..."
                        class="input-luxury focus:ring-2 focus:ring-brand-red/50"></div>
                <div><label for="orderSpecs" class="form-label">ملاحظات سريعة <span
                            class="text-gray-500 font-normal">(اختياري)</span></label><textarea id="orderSpecs"
                        name="specifications" rows="3"
                        placeholder="بماذا يمكننا مساعدتك؟ (التفاصيل سنناقشها في الواتساب)..."
                        class="input-luxury focus:ring-2 focus:ring-brand-red/50"></textarea></div><input type="hidden"
                    id="orderEmail" name="email"><button type="submit" id="btnOrderSubmit"
                    class="btn-filled-red w-full py-5 rounded-xl text-lg mt-6 font-black tracking-wide flex items-center justify-center gap-3"><svg
                        class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" />
                        <path
                            d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 01-4.243-1.214l-.297-.178-2.87.853.853-2.87-.178-.298A8 8 0 1112 20z" />
                    </svg> إرسال ومتابعة عبر واتساب</button>
            </form>
            <div class="mt-6 flex items-center justify-center gap-2 text-xs text-gray-500 bg-white/5 p-3 rounded-lg">
                <svg class="w-4 h-4 text-brand-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>طلبك محفوظ بأمان — سنتواصل معك عبر الواتساب لمناقشة التفاصيل.</div>
        </div>
    </div>
    <script src="app.js" defer></script>
    <script src="visual-system.js" defer></script>
</body>

</html>
