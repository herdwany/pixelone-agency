<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1218">
    <link rel="icon" href="icone/favicon.ico" sizes="any">

    <link rel="icon" type="image/png" sizes="96x96" href="icone/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icone/apple-touch-icon.png">
    <link rel="manifest" href="icone/site.webmanifest">

    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="تفاصيل الخدمة | بيكسل ون">

    <meta property="og:image" content="https://www.pixelonevisuals.tech/icone/web-app-manifest-512x512.png">

    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="تفاصيل خدمات بيكسل ون">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="تفاصيل الخدمة | بيكسل ون">

    <meta name="twitter:image" content="https://www.pixelonevisuals.tech/icone/web-app-manifest-512x512.png">
    <link rel="canonical" href="https://www.pixelonevisuals.tech/service-detail.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body id="view-service-detail" class="site-shell">
    <a href="#mainContent" class="skip-link">تخطي إلى المحتوى الرئيسي</a>

    <main id="mainContent" class="page-frame page-section">
        <section id="serviceDetailRoot" class="animate-fade-up">
            <article class="water-card rounded-3xl p-8 text-center text-gray-400">
                جاري تجهيز تفاصيل الخدمة والمعلومات المرتبطة بها...
            </article>
        </section>
    </main>

    <div id="orderModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true"
        aria-labelledby="orderModalTitle">
        <button type="button" class="modal-close-btn" data-action="close-order-modal" aria-label="إغلاق نافذة الطلب">×</button>
        <div class="modal-content water-card p-8 md:p-10 rounded-[2rem] relative border border-white/10">
            <h3 id="orderModalTitle" class="text-2xl font-black mb-1 text-center text-white">إتمام طلب الخدمة</h3>
            <p id="orderServiceInfo" class="text-center mb-6 text-base font-bold text-brand-red">
                <span id="selectedServiceText">...</span>
                <span id="orderPriceTag" class="text-gray-400 font-normal mr-2"></span>
            </p>
            <div id="orderMsgBox" class="msg-box hidden" aria-live="polite"></div>
            <form id="orderForm" class="space-y-5">
                <input type="hidden" id="hiddenServiceName" name="serviceName">
                <input type="hidden" id="hiddenFinalPrice" name="finalPrice">
                <input type="hidden" id="hiddenDiscountCode" name="discountCode">
                <div>
                    <label for="orderName" class="form-label">الاسم الكامل</label>
                    <input type="text" id="orderName" name="name" required autocomplete="name" placeholder="اكتب اسمك هنا"
                        class="input-luxury">
                </div>
                <div>
                    <label for="orderPhone" class="form-label">رقم الواتساب</label>
                    <input type="tel" id="orderPhone" name="phone" required autocomplete="tel" dir="ltr"
                        placeholder="+212 6XX XXX XXX" class="input-luxury font-en text-left">
                    <p id="orderPhoneHint" class="text-xs text-emerald-400 mt-1 hidden">تم تعبئة رقمك تلقائياً، تأكد فقط من صحته.</p>
                </div>
                <div>
                    <label for="orderProjectName" class="form-label">اسم المشروع أو الشركة</label>
                    <input type="text" id="orderProjectName" name="projectName" required placeholder="اسم المشروع أو النشاط"
                        class="input-luxury">
                </div>
                <div>
                    <label for="orderSpecs" class="form-label">ملاحظات إضافية <span class="text-gray-500 font-normal">(اختياري)</span></label>
                    <textarea id="orderSpecs" name="specifications" rows="3" placeholder="شارك أي تفاصيل تساعدنا على البدء"
                        class="input-luxury"></textarea>
                </div>
                <input type="hidden" id="orderEmail" name="email">
                <button type="submit" id="btnOrderSubmit" class="btn-filled-red w-full py-5 rounded-xl text-lg mt-6 font-black">
                    إرسال الطلب
                </button>
            </form>
        </div>
    </div>

    <script src="app.js" defer></script>
    <script src="visual-system.js" defer></script>
</body>

</html>
