<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelOne Agency - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-500">PixelOne V2</h1>
            <p class="text-gray-400 text-sm mt-2">بوابة الدخول الآمنة</p>
        </div>

        <div id="msgBox" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

        <form id="authForm" class="space-y-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required 
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            
            <input type="password" id="password" placeholder="كلمة المرور" required 
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">

            <button type="submit" id="btnSubmit" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-bold transition duration-200">
                تسجيل الدخول
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400">
            <span id="toggleText">ليس لديك حساب؟</span>
            <a href="#" id="toggleBtn" class="text-blue-400 hover:text-blue-300 font-semibold">إنشاء حساب</a>
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
